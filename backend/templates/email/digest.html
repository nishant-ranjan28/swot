<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111827;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;border:1px solid #e5e7eb;">
        <tr>
          <td style="padding:24px 24px 8px 24px;">
            <p style="margin:0 0 4px 0;font-size:13px;color:#6b7280;">StockPulse</p>
            <h1 style="margin:0 0 16px 0;font-size:20px;line-height:1.3;color:#111827;">$heading</h1>
            <p style="margin:0 0 16px 0;font-size:15px;line-height:1.5;">$greeting</p>
            <p style="margin:0 0 16px 0;font-size:15px;line-height:1.5;">$intro</p>
          </td>
        </tr>
$summary_section
        <tr>
          <td style="padding:0 24px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-size:14px;">
              <tr>
                <th align="left" style="padding:8px 8px 8px 0;border-bottom:1px solid #e5e7eb;color:#6b7280;font-weight:600;">Symbol</th>
                <th align="right" style="padding:8px;border-bottom:1px solid #e5e7eb;color:#6b7280;font-weight:600;">Price</th>
                <th align="right" style="padding:8px 0 8px 8px;border-bottom:1px solid #e5e7eb;color:#6b7280;font-weight:600;">Change</th>
              </tr>
$rows
            </table>
          </td>
        </tr>
$headlines_section
        <tr>
          <td align="center" style="padding:24px;">
            <a href="$watchlist_url" style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:12px 20px;border-radius:8px;">View your watchlist</a>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 24px 24px 24px;border-top:1px solid #e5e7eb;font-size:12px;line-height:1.5;color:#6b7280;">
            You're receiving this because the daily digest is on. Manage digest emails in Settings: <a href="$settings_url" style="color:#2563eb;">$settings_url</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('stockpulse_theme') || '"dark"');
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) { document.documentElement.classList.add('dark'); }
    </script>
    <title>StockPulse - All-in-One Stock Research Platform</title>
    <meta name="description" content="Comprehensive stock research for Indian & US markets — real-time data, AI predictions, mutual funds, technical analysis, charts, screener, and 25+ tools." />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://swot-analyse.vercel.app/" />
    <meta property="og:title" content="StockPulse - All-in-One Stock Research Platform" />
    <meta property="og:description" content="Comprehensive stock research for Indian & US markets — real-time data, AI predictions, mutual funds, technical analysis, charts, screener, and 25+ tools." />
    <meta property="og:image" content="https://swot-analyse.vercel.app/og-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="StockPulse" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StockPulse - All-in-One Stock Research Platform" />
    <meta name="twitter:description" content="Comprehensive stock research for Indian & US markets — real-time data, AI predictions, mutual funds, technical analysis, charts, screener, and 25+ tools." />
    <meta name="twitter:image" content="https://swot-analyse.vercel.app/og-preview.jpg" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <meta name="theme-color" content="#0b0b0c" />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
